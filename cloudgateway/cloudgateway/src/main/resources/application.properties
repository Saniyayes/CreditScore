spring.application.name=cloudgateway
server.port=8080

# Route to userms
spring.cloud.gateway.routes[0].id=userms
spring.cloud.gateway.routes[0].uri=http://${USERMS_HOST:localhost}:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

# Route to credit service
spring.cloud.gateway.routes[1].id=credit
spring.cloud.gateway.routes[1].uri=http://${CREDIT_HOST:localhost}:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/score/**
